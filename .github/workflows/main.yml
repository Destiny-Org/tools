name: Main
on:
  - pull_request # without merge conflicts
  - push # branch or tag

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-latest, windows-latest ]
        dc: [ dmd-2.113.1 ]
    name: ${{ matrix.os }}, ${{ matrix.dc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # read access to the private Destiny-Org repositories, for every clone in the build
      DESTINY_REPO_TOKEN: ${{ secrets.DESTINY_REPO_TOKEN }}
      N: ${{ startsWith(matrix.os, 'macos') && '3' || '2' }}
    steps:
      - uses: actions/checkout@v4
      # Host compiler from the Destiny-Org/host-compilers mirror
      - name: Install D compiler
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Destiny-Org/host-compilers/main/host_compiler.sh -o host_compiler.sh
          bash host_compiler.sh ${{ matrix.dc }}
      # rdmd_test.d needs this
      - name: Set DMD to its basename without extension
        run: |
          val=$(basename "${DMD}")
          val=${val%.*}
          tee -a ${GITHUB_ENV} <<<"DMD=${val}"
      - name: Build
        run: make -j$N DMD=$DMD
      - name: Test
        run: make -j$N DMD=$DMD test
      - name: 'Windows: Build and test with MODEL=32'
        if: runner.os == 'Windows'
        run: make -j$N DMD=$DMD MODEL=32 all test
